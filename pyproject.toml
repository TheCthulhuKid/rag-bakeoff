[project]
name = "rag-bakeoff"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marc", email = "gileadslostson@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
rag-bakeoff = "rag_bakeoff:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=rag_bakeoff --cov-report=term-missing"

[tool.coverage.report]
fail_under = 80
